kind = "web"
previewPath = "/"
title = "今泉歯科医院"
version = "1.0.0"
id = "artifacts/imaizumi-dental"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24814

[services.development]
run = "pnpm --filter @workspace/imaizumi-dental run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imaizumi-dental", "run", "build" ]
publicDir = "artifacts/imaizumi-dental/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24814"
BASE_PATH = "/"
